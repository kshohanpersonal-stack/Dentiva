name: probe
on:
  push:
    branches: [arena/01a0c217-dentiva]
    paths: ['.github/workflows/probe.yml']
jobs:
  win:
    runs-on: windows-latest
    steps:
      - run: |
          mkdir out
          node -e "require('fs').writeFileSync('out/blob.bin', Buffer.alloc(3*1024*1024, 7))"
        shell: bash
      - uses: actions/upload-artifact@v4
        with: { name: probe-artifact, path: out }
